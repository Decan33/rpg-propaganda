name: daily-message
on:
  schedule:
    - cron: "57 12 * * *"        # plain UTC = 13:57 Warsaw
    - cron: "52 13 * * *"        # Warsaw time = 13:52
      timezone: "Europe/Warsaw"
  workflow_dispatch:       # adds a "Run" button for testing
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python daily.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
